# ===== Application =====
spring.application.name=DriveEase

# ===== MySQL Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/driveease?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
driveease.jwt.secret=${JWT_SECRET}
driveease.jwt.expiration-ms=86400000

# ===== File Upload =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
